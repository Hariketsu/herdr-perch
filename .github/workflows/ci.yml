name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Same Xcode as local development; end-to-end tests need a live Herdr and run locally only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
