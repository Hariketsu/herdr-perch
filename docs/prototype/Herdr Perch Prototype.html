<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herdr Perch — Notch Prototype</title>
<!--
  Visual language adapted from vibeisland.app's demo notch (tokens, sizes, spring, layer cross-fade).
  Hover the notch to expand · click a Blocked row to answer · click any other row to jump into Herdr.
-->
<style>
:root {
  --vi-alert: #f97316; --vi-alert-bright: #fb923c;
  --vi-question: #06b6d4; --vi-question-bright: #22d3ee;
  --vi-work: #3b82f6; --vi-work-bright: #60a5fa;
  --vi-idle: #22c55e; --vi-idle-bright: #4ade80;
  --vi-ended: #737373;
  --spring: cubic-bezier(.175, .885, .32, 1.1);
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
  --mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0d0d0f; color: #e5e5e5; font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
.page { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 24px 24px 80px; transition: padding .3s; }
.page.has-tweaks { padding-right: 348px; }

/* ── MacBook screen ───────────────────────────────────── */
.stage { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 10px #1b1b1e, 0 0 0 11px #2a2a2e, 0 30px 80px #000c; }
.screen { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; transform-origin: top left; overflow: hidden;
  background: radial-gradient(1200px 600px at 70% 110%, #2b3448 0%, #1a1f2b 55%, #141821 100%); }
.menubar { position: absolute; top: 0; left: 0; right: 0; height: 32px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; background: #0e1016cc; backdrop-filter: blur(20px); font-size: 13px; color: #ffffffd9; z-index: 5; }
.menubar-l, .menubar-r { display: flex; align-items: center; gap: 18px; }
.apple { width: 13px; height: 15px; background: #fff; border-radius: 40% 40% 45% 45%; opacity: .9; }
.app-name { font-weight: 700; }
.desktop { position: absolute; inset: 32px 0 0 0; }

/* ── Herdr in Ghostty ─────────────────────────────────── */
.term { position: absolute; left: 150px; top: 92px; width: 980px; height: 520px; border-radius: 12px; overflow: hidden;
  background: #111317f2; box-shadow: 0 0 0 1px #ffffff14, 0 24px 60px #0009; transition: transform .35s var(--spring), box-shadow .3s; }
.term-raised { transform: translateY(-4px); box-shadow: 0 0 0 1px #ffffff26, 0 30px 80px #000b; }
.term-bar { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #1a1c21; border-bottom: 1px solid #ffffff0d; }
.td { width: 12px; height: 12px; border-radius: 50%; } .tr { background: #ff5f57; } .ty { background: #febc2e; } .tg { background: #28c840; }
.term-title { flex: 1; text-align: center; font-size: 12px; color: #ffffff80; margin-right: 52px; }
.term-body { display: grid; grid-template-columns: 220px 1fr; height: calc(100% - 30px); font-family: var(--mono); font-size: 12.5px; }
.herdr-side { border-right: 1px solid #ffffff12; padding: 12px 8px; display: flex; flex-direction: column; gap: 14px; background: #0f1114; }
.herdr-session-name { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: #ffffff59; padding: 0 8px 4px; }
.herdr-agent { display: grid; grid-template-columns: 16px auto 1fr; gap: 6px; align-items: center; padding: 4px 8px; border-radius: 5px; color: #ffffffa6; transition: background .3s; }
.herdr-agent.is-focused { background: #ffffff12; color: #fff; }
.herdr-agent.is-flash { background: #3b82f640; }
.ha-proj { color: #ffffff59; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hg-blocked { color: var(--vi-alert); } .hg-done { color: var(--vi-idle); } .hg-working { color: var(--vi-work); } .hg-idle { color: #666; }
.herdr-pane { padding: 18px 22px; display: flex; flex-direction: column; gap: 3px; color: #ffffffcc; line-height: 1.55; transition: background .4s; }
.herdr-pane.is-flash { background: #3b82f612; }
.c-r::before, .c-tool::before { content: "●"; color: var(--vi-idle); margin-right: 8px; font-size: 9px; vertical-align: 1px; }
.c-tree, .c-hint { color: #ffffff66; } .c-ok { color: var(--vi-idle); }
.c-sep { height: 1px; background: #ffffff1a; margin: 6px 0; }
.c-th { color: #a855f7; font-weight: 600; }
.c-code { white-space: pre; color: #ffffffa6; } .c-del { color: #fca5a5; background: #f9731614; } .c-add { color: var(--vi-idle); background: #22c55e14; }
.c-q { margin-top: 10px; color: #fff; font-weight: 600; }
.c-opt { white-space: pre; color: #ffffffa6; } .c-sel { color: var(--vi-question); font-weight: 700; }
.c-prompt { color: #ffffffb3; margin-top: 8px; }
.c-spin { color: #d97757; }

/* ── Notch ────────────────────────────────────────────── */
.notch-wrap { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: center; z-index: 20; pointer-events: none; }
.notch { position: relative; background: #000; pointer-events: auto; cursor: pointer; overflow: visible;
  box-shadow: 0 2px 8px #0009, 0 8px 24px #0000004d;
  transition: width .5s var(--spring), height .5s var(--spring), border-radius .4s ease-out, box-shadow .4s ease-out; }
.notch::before, .notch::after { content: ""; position: absolute; top: 0; width: 13px; height: 25px; pointer-events: none; }
.notch::before { left: -13px; border-top-right-radius: 6px; box-shadow: 5px 0 #000; }
.notch::after { right: -13px; border-top-left-radius: 6px; box-shadow: -5px 0 #000; }
.notch-compact { box-shadow: 0 1px 3px #0006; }
.notch-alert { box-shadow: 0 2px 10px #f9731640, 0 0 0 0 transparent; }
.notch-static { cursor: pointer; box-shadow: none; transition: width .4s var(--spring); }

.band { display: flex; align-items: center; position: relative; z-index: 2; }
.band-l, .band-r { display: flex; align-items: center; transition: width .5s var(--spring); }
.band-l { justify-content: flex-start; padding-left: 14px; }
.band-r { justify-content: flex-end; padding-right: 13px; }
.band-gap { flex-shrink: 0; height: 100%; }

.wing-count { font-size: 10px; font-weight: 600; background: #ffffff1f; padding: 1px 6px; border-radius: 4px; color: #ffffffb3; font-variant-numeric: tabular-nums; }
.wing-count.is-alert { background: #f9731633; color: var(--vi-alert-bright); }
.wing-dots { display: flex; align-items: center; gap: 4px; }
.wdot { width: 6px; height: 6px; border-radius: 50%; }
.wdot-blocked { animation: pulse 1.5s infinite; box-shadow: 0 0 6px var(--vi-alert); }
.wdot-working { animation: breathe 2.4s ease-in-out infinite; }
.wing-more { font-size: 9px; color: #ffffff80; margin-left: 2px; }
.wing-tally { display: flex; align-items: center; gap: 8px; }
.tally { display: flex; align-items: center; gap: 3px; }
.tdot { width: 6px; height: 6px; border-radius: 50%; }
.tally-blocked .tdot { animation: pulse 1.5s infinite; }
.tnum { font-size: 10.5px; font-weight: 600; color: #ffffffcc; font-variant-numeric: tabular-nums; }
.tally-blocked .tnum { color: var(--vi-alert-bright); }

.layer-host { position: relative; }
.layer { padding: 4px 12px 12px; }
.layer-in { animation: layerIn .38s var(--spring) .06s both; }

/* Pixel bird */
.pixel-bird { flex-shrink: 0; filter: drop-shadow(0 0 2px currentColor); }
.bird-working { animation: bob 1.1s ease-in-out infinite; }
.bird-blocked, .bird-question { animation: hop 1.4s var(--spring) infinite; }
.bird-done { filter: drop-shadow(0 0 4px currentColor); }
.bird-idle, .bird-offline { filter: none; opacity: .85; }

/* Overview rows */
.overview { display: flex; flex-direction: column; gap: 2px; }
.notice { font-size: 10.5px; color: #fbbf24; padding: 4px 8px 6px; }
.empty { font-size: 11px; color: #ffffff66; padding: 8px 8px 4px; text-align: center; }
.sess { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; transition: background .15s; font-size: 12px; position: relative; }
.sess:hover { background: #ffffff14; }
.sess-hl { background: #ffffff0f; }
.sess-hero { align-items: flex-start; padding: 8px; gap: 10px; }
.sess-hero .pixel-bird { margin-top: 2px; }
.si { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.sess-r1 { display: flex; align-items: center; gap: 5px; }
.sn { font-weight: 500; color: #fff; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sess-r1 .sn { flex: 1; }
.ss { font-size: 10.5px; line-height: 1.3; display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-pulse { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: pulse 1.5s infinite; flex-shrink: 0; }
.tag { font-size: 9px; font-weight: 500; color: #ffffff80; background: #ffffff1a; padding: 2px 5px; border-radius: 4px; flex-shrink: 0; }
.tag-session { color: #ffffff99; background: #ffffff0d; box-shadow: inset 0 0 0 1px #ffffff1f; }
.dur { font-size: 9px; color: #ffffff80; flex-shrink: 0; min-width: 22px; text-align: right; font-variant-numeric: tabular-nums; }
.sess-mini { padding: 5px 8px; }
.sess-mini .sn { flex: 1; font-size: 11.5px; font-weight: 400; color: #ffffffbf; }
.sess-tags { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.mini-status { font-size: 10px; font-weight: 600; flex-shrink: 0; }
.sd { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.sd-blocked { animation: pulse 1.5s infinite; }
.sd-working { animation: breathe 2.4s ease-in-out infinite; }
.row-affordance { width: 10px; color: #ffffff00; font-size: 12px; transition: color .15s; flex-shrink: 0; text-align: center; }
.sess:hover .row-affordance { color: #ffffff80; }

/* Cards */
.card { display: flex; flex-direction: column; gap: 7px; padding: 2px 2px 0; }
.card-head { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.back { background: none; border: none; color: #ffffff80; font-size: 15px; line-height: 1; padding: 0 4px 0 0; cursor: pointer; }
.back:hover { color: #fff; }
.head-dot { width: 6px; height: 6px; border-radius: 50%; animation: pulse 1.5s infinite; }
.head-label { font-weight: 600; }
.head-meta { color: #ffffff66; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.open-link { background: none; border: none; color: #ffffff73; font-size: 10px; cursor: pointer; padding: 0; }
.open-link:hover { color: #fff; }
.appr-tool { display: flex; align-items: center; gap: 6px; }
.appr-icon { font-size: 11px; color: var(--vi-alert); }
.appr-name { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--vi-alert); }
.appr-input { font-family: var(--mono); font-size: 11px; color: #ffffffd9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.appr-ctx { font-family: var(--mono); display: flex; flex-direction: column; gap: 3px; }
.diff { background: #ffffff0a; border-radius: 5px; padding: 4px 0; max-height: 84px; overflow: hidden; font-family: var(--mono); }
.diff-line { display: flex; align-items: baseline; gap: 6px; padding: 0 8px; font-size: 10px; line-height: 1.65; color: #ffffff80; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.diff-ln { color: #fff3; min-width: 14px; text-align: right; }
.diff-del { color: #fca5a5; background: #f9731614; } .diff-add { color: var(--vi-idle); background: #22c55e14; } .diff-ctx { color: #ffffff73; white-space: normal; }
.diff-cmd { color: #ffffffd9; }
.appr-diff { font-size: 9.5px; color: #ffffff59; font-family: var(--font-sans); }
.card-notice { font-size: 10.5px; color: #fbbf24; display: flex; align-items: center; gap: 6px; animation: layerIn .3s var(--spring) both; }
.card-notice::before { content: "↻"; }
.appr-btns { display: flex; gap: 6px; padding-top: 2px; }
.appr-btns button { flex: 1; padding: 6px 12px; border-radius: 7px; font-size: 11px; font-weight: 500; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background .15s, transform .1s; }
.appr-btns button:active { transform: scale(.97); }
.appr-btns button:disabled { opacity: .55; cursor: default; }
.btn-deny, .btn-always { background: #ffffff26; color: #ffffffe6; }
.btn-deny:hover, .btn-always:hover { background: #fff3; }
.btn-allow { background: #ffffffe6; color: #000; }
.btn-allow:hover { background: #fff; }
.appr-btns kbd { font-family: var(--mono); font-size: 9px; opacity: .5; }
.ask-q { font-size: 12px; font-weight: 500; color: #ffffffe6; }
.ask-opts { display: flex; flex-direction: column; gap: 4px; }
.ask-opt { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px; border-radius: 7px; border: none; cursor: pointer; background: #06b6d426; text-align: left; width: 100%; font-size: 11px; color: #ffffffe6; transition: background .15s; }
.ask-opt:hover { background: #06b6d440; }
.ask-opt:disabled { opacity: .6; }
.ask-num { font-size: 10px; font-weight: 700; color: #fff; background: #06b6d499; width: 18px; height: 18px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); flex-shrink: 0; }
.ask-num-ghost { background: #ffffff1f; color: #ffffff99; }
.ask-text { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 6px; border-radius: 7px; background: #ffffff0d; box-shadow: inset 0 0 0 1px #ffffff14; }
.ask-text input { flex: 1; background: none; border: none; outline: none; color: #fff; font: inherit; font-size: 11px; }
.ask-text input::placeholder { color: #ffffff59; }
.fallback-text { font-size: 11px; color: #ffffffb3; }
.feedback { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; padding: 2px 0 6px; }
.spin { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #ffffff4d; border-top-color: #fff; animation: spin .7s linear infinite; display: inline-block; }
.spin.dark { border-color: #0003; border-top-color: #000; }

/* ── Compare strip ────────────────────────────────────── */
.compare { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: min(1280px, 100%); }
.compare-item { background: #18181b; border: 1px solid #ffffff12; border-radius: 12px; padding: 0 0 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; color: inherit; overflow: hidden; transition: border-color .2s; }
.compare-item.is-active { border-color: #ffffff59; }
.compare-bar { width: 100%; height: 44px; background: #0e1016; display: flex; justify-content: center; }
.compare-label { font-size: 12px; color: #ffffffb3; }

/* ── Tweaks ───────────────────────────────────────────── */
.tweaks-toggle { position: fixed; right: 18px; bottom: 18px; z-index: 50; background: #27272a; color: #fff; border: 1px solid #ffffff1f; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
.tweaks { position: fixed; right: 18px; top: 24px; z-index: 50; width: 300px; background: #18181bf2; backdrop-filter: blur(16px); border: 1px solid #ffffff1a; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 11.5px; box-shadow: 0 20px 50px #0009; }
.tw-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #ffffffb3; }
.seg { display: flex; background: #ffffff0f; border-radius: 6px; padding: 2px; gap: 2px; }
.seg button { background: none; border: none; color: #ffffff99; font-size: 11px; padding: 3px 8px; border-radius: 4px; cursor: pointer; }
.seg button.is-on { background: #ffffff26; color: #fff; }
.tw-sep { height: 1px; background: #ffffff14; margin: 2px 0; }
.tw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.tw-grid button { background: #ffffff0f; border: 1px solid #ffffff14; color: #ffffffd9; border-radius: 6px; padding: 5px 6px; font-size: 11px; cursor: pointer; }
.tw-grid button:hover { background: #ffffff1f; }
.tw-grid button.is-armed { border-color: #fbbf24; color: #fbbf24; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes breathe { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.8); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-3px); } }
@keyframes layerIn { from { opacity: 0; filter: blur(6px); transform: scale(.96); } to { opacity: 1; filter: blur(0); transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .notch, .band-l, .band-r { transition-duration: .01s; }
  .layer-in, .pixel-bird, .wdot, .sd, .tdot, .ss-pulse, .head-dot { animation: none !important; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="pixel-bird.jsx"></script>
<script type="text/babel" src="notch.jsx"></script>
<script type="text/babel" src="scene.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
